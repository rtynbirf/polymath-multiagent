[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymath-multiagent"
version = "0.5.1"
description = "Полимат = Мультиагент: параллельная оркестрация агентов, где одно другое не исключает"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rtynbirf" }]
keywords = ["multi-agent", "ai-agents", "asyncio", "orchestration", "polymath", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.10,<3"]
dev = ["pytest>=8", "ruff>=0.6", "fastmcp>=2.10,<3", "pyyaml>=6"]

[project.scripts]
polymath = "polymath.cli:main"

[tool.setuptools.packages.find]
include = ["polymath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
